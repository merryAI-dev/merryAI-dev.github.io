<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">지출결의 요청에서 임시보관 검증까지</title><desc id="desc">미해결 질문은 검토로 돌아갑니다. 불명확한 쓰기는 자동 재전송하지 않습니다.
완료 범위는 임시보관 검증까지입니다. 상신·결재·지급은 사용자의 후속 절차입니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#062E61"/></marker></defs>
<rect width="1120" height="660" fill="#F7FBFC"/>
<path d="M56 32V620" stroke="#59BDD8" stroke-width="2"/>
<text x="88" y="70" fill="#031F43" font-size="28" font-family="Pretendard, sans-serif" font-weight="700">지출결의 요청에서 임시보관 검증까지</text>
<rect x="88" y="112" width="304" height="144" rx="4" fill="white" stroke="#062E61"/>
<text x="108" y="142" fill="#5F7082" font-size="14" font-family="IBM Plex Mono, monospace">01</text>
<text x="108" y="177" fill="#062E61" font-size="24" font-weight="700" font-family="Pretendard, sans-serif">요청 해석</text>
<text x="108" y="211" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">Skill이 사용월·증빙 확인</text>
<text x="108" y="235" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">기존 CLI를 실행</text>
<path d="M394 184H418" stroke="#062E61" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="424" y="112" width="304" height="144" rx="4" fill="white" stroke="#062E61"/>
<text x="444" y="142" fill="#5F7082" font-size="14" font-family="IBM Plex Mono, monospace">02</text>
<text x="444" y="177" fill="#062E61" font-size="24" font-weight="700" font-family="Pretendard, sans-serif">검토안 생성</text>
<text x="444" y="211" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">카드 원본·승인 이력 조회</text>
<text x="444" y="235" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">PDF 건수·합계·행 대조</text>
<path d="M730 184H754" stroke="#062E61" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="760" y="112" width="304" height="144" rx="4" fill="white" stroke="#062E61"/>
<text x="780" y="142" fill="#5F7082" font-size="14" font-family="IBM Plex Mono, monospace">03</text>
<text x="780" y="177" fill="#062E61" font-size="24" font-weight="700" font-family="Pretendard, sans-serif">질문 해소</text>
<text x="780" y="211" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">목적·모호한 연결 확인</text>
<text x="780" y="235" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">답변을 검토안에 반영</text>
<rect x="88" y="320" width="304" height="144" rx="4" fill="white" stroke="#062E61"/>
<text x="108" y="350" fill="#5F7082" font-size="14" font-family="IBM Plex Mono, monospace">04</text>
<text x="108" y="385" fill="#062E61" font-size="24" font-weight="700" font-family="Pretendard, sans-serif">저장 전 확인</text>
<text x="108" y="419" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">검토 화면을 사용자와 확인</text>
<text x="108" y="443" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">현재 상태로 check</text>
<path d="M394 392H418" stroke="#062E61" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="424" y="320" width="304" height="144" rx="4" fill="white" stroke="#062E61"/>
<text x="444" y="350" fill="#5F7082" font-size="14" font-family="IBM Plex Mono, monospace">05</text>
<text x="444" y="385" fill="#062E61" font-size="24" font-weight="700" font-family="Pretendard, sans-serif">임시보관</text>
<text x="444" y="419" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">첨부 → 연결키 → ERP</text>
<text x="444" y="443" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">전자결재 임시보관 저장</text>
<path d="M730 392H754" stroke="#062E61" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="760" y="320" width="304" height="144" rx="4" fill="white" stroke="#062E61"/>
<text x="780" y="350" fill="#5F7082" font-size="14" font-family="IBM Plex Mono, monospace">06</text>
<text x="780" y="385" fill="#062E61" font-size="24" font-weight="700" font-family="Pretendard, sans-serif">재조회·대조</text>
<text x="780" y="419" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">주요 필드·본문 영수증 연결</text>
<text x="780" y="443" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">첨부 해시·상태 확인</text>
<path d="M1064 258 V288 H240 V314" fill="none" stroke="#062E61" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M88 520H1096" stroke="#FF7A1A" stroke-width="3"/>
<text x="88" y="560" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">미해결 질문은 검토로 돌아갑니다. 불명확한 쓰기는 자동 재전송하지 않습니다.</text>
<text x="88" y="590" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">완료 범위는 임시보관 검증까지입니다. 상신·결재·지급은 사용자의 후속 절차입니다.</text>
</svg>