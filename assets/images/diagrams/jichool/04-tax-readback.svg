<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1196" viewBox="0 0 640 1196" role="img" aria-labelledby="title desc">
<title id="title">세금계산서: 저장 응답 다음의 검증</title><desc id="desc">업로드·연결키·ERP 결과 불명확은 자동 재전송하지 않습니다.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#062E61"/></marker></defs>
<rect width="640" height="1196" fill="#F7FBFC"/>
<text x="32" y="40" font-size="26" font-family="Pretendard,sans-serif" fill="#031F43" font-weight="700">세금계산서: 저장 응답 다음의 검증</text>
<rect x="110" y="72" width="420" height="94" rx="4" fill="white" stroke="#062E61" stroke-width="2"/>
<text x="130" y="95" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">사용자 / Skill 절차</text>
<text x="130" y="124" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">최종 내용을 보고 임시보관 요청</text>
<rect x="110" y="204" width="420" height="94" rx="4" fill="white" stroke="#062E61" stroke-width="2"/>
<text x="130" y="227" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">CLI → 아마란스</text>
<text x="130" y="256" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">첨부·연결키·ERP·전자결재 저장</text>
<text x="130" y="285" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">단계별 시도·완료 기록</text>
<rect x="110" y="336" width="420" height="94" rx="4" fill="#E7F6FA" stroke="#062E61" stroke-width="2"/>
<text x="130" y="359" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">CLI / 저장 결과 확인</text>
<text x="130" y="388" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">전자결재 응답이 확인됐나?</text>
<rect x="110" y="468" width="420" height="94" rx="4" fill="#E7F6FA" stroke="#062E61" stroke-width="2"/>
<text x="130" y="491" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">CLI ↔ 아마란스 / 응답 유실</text>
<text x="130" y="520" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">연결된 기존 문서 조회</text>
<text x="130" y="549" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">찾지 못하면 재전송 없이 중단</text>
<rect x="110" y="600" width="420" height="94" rx="4" fill="white" stroke="#062E61" stroke-width="2"/>
<text x="130" y="623" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">CLI ↔ 아마란스 / 재조회</text>
<text x="130" y="652" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">금액·증빙일·프로젝트·계좌 비교</text>
<text x="130" y="681" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">임시보관 상태·비고·첨부 확인</text>
<rect x="110" y="732" width="420" height="94" rx="4" fill="#E7F6FA" stroke="#062E61" stroke-width="2"/>
<text x="130" y="755" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">CLI / 기대값과 비교</text>
<text x="130" y="784" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">검토안과 저장 결과가 일치하나?</text>
<rect x="110" y="864" width="420" height="94" rx="4" fill="#FFF3E8" stroke="#FF7A1A" stroke-width="2"/>
<text x="130" y="887" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">AI → 사용자 / 불일치</text>
<text x="130" y="916" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">다른 항목을 보고하고 중단</text>
<text x="130" y="945" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">자동 수정·덮어쓰기하지 않음</text>
<rect x="110" y="996" width="420" height="94" rx="4" fill="white" stroke="#062E61" stroke-width="2"/>
<text x="130" y="1019" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">AI → 사용자 / 일치</text>
<text x="130" y="1048" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">임시보관 검증 완료 안내</text>
<text x="130" y="1077" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">이후 직접 검토·상신</text>
