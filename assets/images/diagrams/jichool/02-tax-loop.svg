<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">세금계산서 처리에서 구분한 검증과 판단</title><desc id="desc">금액 검산과 거래 후보 제안은 확신 수준이 다릅니다. 모호한 관계는 사용자에게 묻습니다.
지급요청 모드도 초안 준비입니다. 이 흐름에서 상신이나 지급을 실행하지 않습니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#062E61"/></marker></defs>
<rect width="1120" height="660" fill="#F7FBFC"/>
<path d="M56 32V620" stroke="#59BDD8" stroke-width="2"/>
<text x="88" y="70" fill="#031F43" font-size="28" font-family="Pretendard, sans-serif" font-weight="700">세금계산서 처리에서 구분한 검증과 판단</text>
<rect x="88" y="112" width="304" height="144" rx="4" fill="white" stroke="#062E61"/>
<text x="108" y="142" fill="#5F7082" font-size="14" font-family="IBM Plex Mono, monospace">01</text>
<text x="108" y="177" fill="#062E61" font-size="24" font-weight="700" font-family="Pretendard, sans-serif">PDF 항목 읽기</text>
<text x="108" y="211" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">공급가액 + 세액 = 합계</text>
<text x="108" y="235" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">작성일·영수/청구 확인</text>
<path d="M394 184H418" stroke="#062E61" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="424" y="112" width="304" height="144" rx="4" fill="white" stroke="#062E61"/>
<text x="444" y="142" fill="#5F7082" font-size="14" font-family="IBM Plex Mono, monospace">02</text>
<text x="444" y="177" fill="#062E61" font-size="24" font-weight="700" font-family="Pretendard, sans-serif">관계 후보 찾기</text>
<text x="444" y="211" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">기존 1210 중복 후보</text>
<text x="444" y="235" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">기간·동일 금액의 카드 후보</text>
<path d="M730 184H754" stroke="#062E61" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="760" y="112" width="304" height="144" rx="4" fill="white" stroke="#062E61"/>
<text x="780" y="142" fill="#5F7082" font-size="14" font-family="IBM Plex Mono, monospace">03</text>
<text x="780" y="177" fill="#062E61" font-size="24" font-weight="700" font-family="Pretendard, sans-serif">의미 확인</text>
<text x="780" y="211" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">사용자가 결제 관계 확인</text>
<text x="780" y="235" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">적요·프로젝트·방식 검토</text>
<rect x="88" y="320" width="304" height="144" rx="4" fill="white" stroke="#062E61"/>
<text x="108" y="350" fill="#5F7082" font-size="14" font-family="IBM Plex Mono, monospace">04</text>
<text x="108" y="385" fill="#062E61" font-size="24" font-weight="700" font-family="Pretendard, sans-serif">현재 조건 확인</text>
<text x="108" y="419" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">PDF 변경·중복·마감 검사</text>
<text x="108" y="443" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">최종 내용 확인 후 저장 요청</text>
<path d="M394 392H418" stroke="#062E61" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="424" y="320" width="304" height="144" rx="4" fill="white" stroke="#062E61"/>
<text x="444" y="350" fill="#5F7082" font-size="14" font-family="IBM Plex Mono, monospace">05</text>
<text x="444" y="385" fill="#062E61" font-size="24" font-weight="700" font-family="Pretendard, sans-serif">임시보관</text>
<text x="444" y="419" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">단계별 작업 기록 보관</text>
<text x="444" y="443" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">결과 불명확 시 중단</text>
<path d="M730 392H754" stroke="#062E61" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="760" y="320" width="304" height="144" rx="4" fill="white" stroke="#062E61"/>
<text x="780" y="350" fill="#5F7082" font-size="14" font-family="IBM Plex Mono, monospace">06</text>
<text x="780" y="385" fill="#062E61" font-size="24" font-weight="700" font-family="Pretendard, sans-serif">저장 결과 대조</text>
<text x="780" y="419" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">ERP 값·상태·본문 비고</text>
<text x="780" y="443" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">계좌값·첨부 해시 비교</text>
<path d="M1064 258 V288 H240 V314" fill="none" stroke="#062E61" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M88 520H1096" stroke="#FF7A1A" stroke-width="3"/>
<text x="88" y="560" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">금액 검산과 거래 후보 제안은 확신 수준이 다릅니다. 모호한 관계는 사용자에게 묻습니다.</text>
<text x="88" y="590" fill="#172536" font-size="17" font-family="Pretendard, sans-serif">지급요청 모드도 초안 준비입니다. 이 흐름에서 상신이나 지급을 실행하지 않습니다.</text>
</svg>