<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1196" viewBox="0 0 640 1196" role="img" aria-labelledby="title desc">
<title id="title">세금계산서: 증빙과 결제 관계 확인</title><desc id="desc">지급요청 건은 카드 후보를 결제일 조건으로 요구하지 않습니다.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#062E61"/></marker></defs>
<rect width="640" height="1196" fill="#F7FBFC"/>
<text x="32" y="40" font-size="26" font-family="Pretendard,sans-serif" fill="#031F43" font-weight="700">세금계산서: 증빙과 결제 관계 확인</text>
<rect x="110" y="72" width="420" height="94" rx="4" fill="white" stroke="#062E61" stroke-width="2"/>
<text x="130" y="95" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">사용자 → AI / Skill</text>
<text x="130" y="124" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">PDF와 이번 지출의 목적 전달</text>
<rect x="110" y="204" width="420" height="94" rx="4" fill="#E7F6FA" stroke="#062E61" stroke-width="2"/>
<text x="130" y="227" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">CLI / 증빙 읽기</text>
<text x="130" y="256" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">작성일·공급가액·세액·합계 검사</text>
<text x="130" y="285" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">읽기 실패·불일치면 중단</text>
<rect x="110" y="336" width="420" height="94" rx="4" fill="#E7F6FA" stroke="#062E61" stroke-width="2"/>
<text x="130" y="359" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">CLI ↔ 아마란스 / 중복 대조</text>
<text x="130" y="388" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">같은 증빙일·합계·거래처가 있나?</text>
<rect x="110" y="468" width="420" height="94" rx="4" fill="#FFF3E8" stroke="#FF7A1A" stroke-width="2"/>
<text x="130" y="491" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">AI → 사용자</text>
<text x="130" y="520" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">반려 외 중복 후보는 저장 차단</text>
<text x="130" y="549" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">반려 문서는 참고 경고</text>
<rect x="110" y="600" width="420" height="94" rx="4" fill="#E7F6FA" stroke="#062E61" stroke-width="2"/>
<text x="130" y="623" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">CLI / 인식용 결제 후보</text>
<text x="130" y="652" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">같은 금액의 카드 후보가 하나?</text>
<rect x="110" y="732" width="420" height="94" rx="4" fill="white" stroke="#062E61" stroke-width="2"/>
<text x="130" y="755" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">AI / Skill ↔ 사용자</text>
<text x="130" y="784" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">없거나 여러 개면 결제일 질문</text>
<text x="130" y="813" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">이체 여부·실제 관계 확인</text>
<rect x="110" y="864" width="420" height="94" rx="4" fill="white" stroke="#062E61" stroke-width="2"/>
<text x="130" y="887" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">사용자 / Skill 절차</text>
<text x="130" y="916" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">적요·용도·프로젝트·지급 정보 검토</text>
<text x="130" y="945" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">하나인 후보도 실제 관계 확인</text>
<rect x="110" y="996" width="420" height="94" rx="4" fill="white" stroke="#062E61" stroke-width="2"/>
<text x="130" y="1019" font-family="Pretendard,sans-serif" font-size="17" fill="#5F7082">CLI / 저장 준비</text>
<text x="130" y="1048" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">현재 중복·증빙 변경·마감 재검사</text>
<text x="130" y="1077" font-family="Pretendard,sans-serif" font-size="24" fill="#172536">통과 후 임시보관 요청 확인</text>
<path d="M320 166V200" fill="none" stroke="#062E61" stroke-width="2" marker-end="url(#a)"/>
<path d="M320 298V332" fill="none" stroke="#062E61" stroke-width="2" marker-end="url(#a)"/>
<text x="333" y="322.0" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">통과</text>
<path d="M320 430V464" fill="none" stroke="#062E61" stroke-width="2" marker-end="url(#a)"/>
<text x="333" y="454.0" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">있음</text>
<path d="M530 383H588V647H530" fill="none" stroke="#062E61" stroke-width="2" marker-end="url(#a)"/>
<text x="596" y="465.0" text-anchor="middle" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">없</text>
<text x="596" y="485.0" text-anchor="middle" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">음</text>
<text x="596" y="505.0" text-anchor="middle" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">·</text>
<text x="596" y="525.0" text-anchor="middle" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">반</text>
<text x="596" y="545.0" text-anchor="middle" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">려</text>
<path d="M320 694V728" fill="none" stroke="#062E61" stroke-width="2" marker-end="url(#a)"/>
<text x="333" y="718.0" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">아니오</text>
<path d="M320 826V860" fill="none" stroke="#062E61" stroke-width="2" marker-end="url(#a)"/>
<text x="333" y="850.0" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">확인함</text>
<path d="M110 647H52V911H110" fill="none" stroke="#062E61" stroke-width="2" marker-end="url(#a)"/>
<text x="44" y="699.0" text-anchor="middle" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">예</text>
<text x="44" y="719.0" text-anchor="middle" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">:</text>
<text x="44" y="739.0" text-anchor="middle" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif"> </text>
<text x="44" y="759.0" text-anchor="middle" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">날</text>
<text x="44" y="779.0" text-anchor="middle" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">짜</text>
<text x="44" y="799.0" text-anchor="middle" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif"> </text>
<text x="44" y="819.0" text-anchor="middle" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">제</text>
<text x="44" y="839.0" text-anchor="middle" font-size="17" fill="#062E61" font-family="Pretendard,sans-serif">안</text>
<path d="M320 958V992" fill="none" stroke="#062E61" stroke-width="2" marker-end="url(#a)"/>
<text x="32" y="1174" font-family="Pretendard,sans-serif" font-size="18" fill="#5F7082">지급요청 건은 카드 후보를 결제일 조건으로 요구하지 않습니다.</text></svg>